name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend image
        run: |
          cd backend
          docker build -t backend:latest .
      
      - name: Save image
        run: |
          docker save backend:latest -o /tmp/backend.tar
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: /tmp/backend.tar

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Node dependencies
        run: |
          cd frontend
          npm install
      
      - name: Build React
        run: |
          cd frontend
          npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend
        run: |
          cd backend
          docker build -t backend:latest .
      
      - name: Echo deployment
        run: |
          echo "In production, this would push to AWS ECR and deploy to ECS/App Runner"
          echo "For now, workflow is set up and runs on every push"
